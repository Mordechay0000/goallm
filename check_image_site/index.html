<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>Image Analyzer</title>

  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --accent: #4da3ff;
      --danger: #e53935;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ffffff, var(--bg));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shell {
      width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-weight: 600;
      color: var(--text);
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .dropzone {
      border: 2px dashed #dbe2ea;
      border-radius: 22px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      transition: 0.2s;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: #f0f7ff;
    }

    .dropzone img {
      max-height: 220px;
      object-fit: contain;
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #6b7280;
    }

    .hint strong {
      color: #e53935;
    }


    .remove-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      /* צד שמאל */

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;
      border-radius: 50%;

      background: rgba(229, 57, 53, 0.35);
      /* בהיר יותר */
      cursor: pointer;
      z-index: 10;
      padding: 0;

      transition: background 0.15s ease, transform 0.15s ease;
    }

    .remove-btn svg {
      width: 16px;
      height: 16px;
      stroke: white;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .remove-btn:hover {
      background: rgba(229, 57, 53, 0.75);
      /* כהה יותר ב-hover */
      transform: scale(1.05);
    }



    .inputs {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    input[type="file"],
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid #e5e7eb;
    }


    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #5fa9ff, #3b82f6);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    .result {
      margin-top: 28px;
      text-align: center;
    }

    .decision {
      display: none;
      margin: 0 auto 10px;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 28px;
      font-weight: 700;
      width: fit-content;
    }

    .decision.allowed {
      background: #dcfce7;
      color: #166534;
    }

    .decision.blocked {
      background: #fee2e2;
      color: #991b1b;
    }


    .blocked {
      display: none;
      font-size: 42px;
      font-weight: 700;
      color: var(--danger);
    }

    .spoiler-btn {
      display: none;
      margin-top: 12px;
      background: none;
      color: var(--accent);
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .details {
      display: none;
      margin-top: 12px;
      text-align: right;
      background: #f9fafb;
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      color: var(--text);
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="shell">
    <h1>ניתוח תמונה</h1>
    <div class="subtitle">העלאה · הדבקה · גרירה · קישור</div>

    <div class="dropzone" id="dropzone">
      <span id="dropText">גרור תמונה לכאן, הדבק (Ctrl+V) או לחץ לבחירה</span>
      <div id="fileHint" class="hint" style="display:none;"></div>
      <div id="previewWrapper" style="display:none; position:relative;">
        <img id="preview" style="max-width:100%; border-radius:14px;">
        <button id="removeImage" type="button" class="remove-btn" aria-label="Remove image">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <line x1="5" y1="5" x2="19" y2="19" />
            <line x1="19" y1="5" x2="5" y2="19" />
          </svg>
        </button>
      </div>
    </div>



    <div class="inputs">
      <input type="file" id="hiddenFileInput" accept="image/*" hidden>
      <input type="text" id="urlInput" placeholder="הדבק קישור לתמונה כאן" style="flex:1;">
      <div id="urlHint" class="hint" style="display:none;"></div>

    </div>

    <button onclick="analyze()">נתח תמונה</button>

    <div class="result">
      <div id="decision" class="decision"></div>
      <button class="spoiler-btn" id="spoilerBtn" onclick="toggleDetails()">הצג פירוט</button>
      <div class="details" id="details"></div>
    </div>
  </div>

  <script>

    const CONDITION_LABELS = {
      "women_girls_9_plus": "נשים/בנות מעל גיל 9?",
      "girls_3_9_incomplete_clothing": "ילדות (3-9) בלבוש לא הולם",
      "girls_under_3_minimal_or_nude": "ילדות מתחת לגיל 3 בלבוש מינימלי או בלי לבוש בכלל",
      "boys_teens_men_exposed_or_bathing": "ילדים/נערים/גברים חשופים או מתרחצים",
      "any_visible_body_exposure": "חשיפה נראית לעין",
    };

    let selectedFile = null;

    const dropzone = document.getElementById("dropzone");
    const hiddenFileInput = document.getElementById("hiddenFileInput");
    const preview = document.getElementById("preview");
    const previewWrapper = document.getElementById("previewWrapper");
    const dropText = document.getElementById("dropText");
    const urlInput = document.getElementById("urlInput");
    const removeImageBtn = document.getElementById("removeImage");

    // ---------- state helpers ----------
    function setImage(file) {
      resetResultUI();

      selectedFile = file;

      urlInput.value = "";
      urlInput.disabled = true;
      urlInput.placeholder =
        "שדה הקישור מושבת — נבחרה תמונה. להסרה לחץ על ✕ בתמונה";

      document.getElementById("urlHint").style.display = "none";
      document.getElementById("fileHint").style.display = "none";

      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        previewWrapper.style.display = "block";
        dropText.style.display = "none";
      };
      reader.readAsDataURL(file);
      updateAnalyzeButton()
    }


    function clearImage() {
      resetResultUI(); 


      selectedFile = null;
      preview.src = "";
      previewWrapper.style.display = "none";
      dropText.style.display = "block";
      hiddenFileInput.value = "";

      urlInput.disabled = false;
      urlInput.placeholder = "הדבק קישור לתמונה כאן";
      updateAnalyzeButton()
    }


    // ---------- click to open file picker ----------
    dropzone.addEventListener("click", () => {
      if (!selectedFile && !urlInput.value) {
        hiddenFileInput.click();
      }
    });

    hiddenFileInput.addEventListener("change", () => {
      if (hiddenFileInput.files.length > 0) {
        setImage(hiddenFileInput.files[0]);
      }
    });

    // ---------- drag & drop ----------
    dropzone.addEventListener("dragover", e => {
      if (urlInput.value) return;
      e.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    dropzone.addEventListener("drop", e => {
      if (urlInput.value) return;
      e.preventDefault();
      dropzone.classList.remove("dragover");

      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith("image")) {
        setImage(file);
      }
    });

    // ---------- paste ----------
    document.addEventListener("paste", e => {
      if (urlInput.value || selectedFile) return;

      const item = [...e.clipboardData.items]
        .find(i => i.type.startsWith("image"));

      if (item) {
        setImage(item.getAsFile());
      }
    });

    // ---------- remove image ----------
    removeImageBtn.addEventListener("click", e => {
      e.stopPropagation();
      clearImage();
    });

    // ---------- URL logic ----------
    urlInput.addEventListener("input", () => {
      resetResultUI();

      if (urlInput.value.trim()) {
        clearImage();

        hiddenFileInput.disabled = true;
        dropText.textContent =
          "בחירת קובץ מושבתת — הוזן קישור. להסרה נקה את שדה הקישור";
      } else {
        hiddenFileInput.disabled = false;
        dropText.textContent =
          "גרור תמונה לכאן, הדבק (Ctrl+V) או לחץ לבחירה";
      }
      updateAnalyzeButton()
    });

    function updateAnalyzeButton() {
      const btn = document.querySelector("button");
      btn.disabled = !(selectedFile || urlInput.value.trim());
    }

    // ---------- reset result UI ----------
    function resetResultUI() {
      const decision = document.getElementById("decision");
      const details = document.getElementById("details");
      const spoilerBtn = document.getElementById("spoilerBtn");

      decision.style.display = "none";
      decision.className = "decision";
      decision.textContent = "";

      details.style.display = "none";
      details.innerHTML = "";

      spoilerBtn.style.display = "none";
    }


    // ---------- analyze ----------
    let isAnalyzing = false;
    async function analyze() {
      if (isAnalyzing) return;
      isAnalyzing = true;

      const button = event.target;
      button.disabled = true;
      button.textContent = "מנתח...";

      try {
        const formData = new FormData();

        if (selectedFile) {
          formData.append("image", selectedFile);
        } else if (urlInput.value.trim()) {
          formData.append("image_url", urlInput.value.trim());
        } else {
          alert("לא נבחרה תמונה");
          return;
        }

        const res = await fetch("/analyze", {
          method: "POST",
          body: formData
        });

        if (!res.ok) {
          throw new Error(await res.text());
        }

        const data = await res.json();

        const imageKey = Object.keys(data)[0];
        const conditions = data[imageKey];

        const hasYes = Object.values(conditions).includes("Yes");

        const decision = document.getElementById("decision");
        decision.style.display = "block";
        decision.className = "decision " + (hasYes ? "blocked" : "allowed");
        decision.textContent = hasYes ? "❌ אסור" : "✔ מותר";

        document.getElementById("spoilerBtn").style.display = "inline";

        document.getElementById("details").innerHTML =
          Object.entries(conditions)
            .map(([key, value]) => {
              const label = CONDITION_LABELS[key] || key;
              const ok = value === "No";
              return `• ${label} — <strong>${ok ? "לא" : "כן"}</strong>`;
            })
            .join("<br>");


      } catch (err) {
        isAnalyzing = false;
        alert("שגיאה:\n" + err.message);
      } finally {
        isAnalyzing = false;
        button.disabled = false;
        button.textContent = "נתח תמונה";
      }
    }

    function toggleDetails() {
      const d = document.getElementById("details");
      const btn = document.getElementById("spoilerBtn");

      const open = d.style.display === "none";
      d.style.display = open ? "block" : "none";
      btn.textContent = open ? "הסתר פירוט" : "הצג פירוט";
    }

  </script>


</body>

</html>
